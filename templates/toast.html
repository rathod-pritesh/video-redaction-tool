<!-- Reusable Toast Notification Partial for VideoRedact -->
<div id="toastContainer" class="toast-container-custom" aria-live="polite" aria-atomic="true">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="server-flash-msg" data-category="{{ category }}" data-message="{{ message }}" style="display:none;"></div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>
